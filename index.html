<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deaddilly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --fg: #e8e4dc;
      --dim: #555;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: Helvetica, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      cursor: default;
      min-height: 100vh;
    }

    /* Glitch title — centered */
    .title-wrap {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    h1 {
      font-family: Helvetica, Arial, sans-serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--fg);
      display: inline-block;
    }

    h1 .letter {
      display: inline-block;
    }

    h1 .letter.frak {
      font-family: 'UnifrakturMaguntia', cursive;
      font-size: 1.1em;
      line-height: 0.85;
      vertical-align: middle;
    }

    /* Bio + links — bottom-left */
    .bottom-left {
      position: fixed;
      bottom: clamp(1.5rem, 4vw, 3rem);
      left: clamp(1.5rem, 4vw, 3rem);
      z-index: 1;
    }

    .bio {
      font-size: clamp(0.85rem, 1.5vw, 1rem);
      color: #aaa;
      line-height: 1.75;
      margin-bottom: 1.2rem;
    }

    .bio em {
      font-family: 'UnifrakturMaguntia', cursive;
      font-size: 1.1em;
      color: #03ff38;
      font-style: normal;
    }

    .section-label {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-label::after {
      content: '↓';
      font-size: 0.8rem;
    }

    .contact-link {
      display: block;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.95rem;
      color: #666;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.2s;
      margin-bottom: 0.4rem;
    }

    .contact-link:hover {
      color: var(--fg);
    }

    /* --- AUDIO PROMPT — top-right --- */
    #audio-prompt {
      position: fixed;
      top: clamp(1.5rem, 4vw, 3rem);
      right: clamp(1.5rem, 4vw, 3rem);
      z-index: 10;
      cursor: pointer;
      user-select: none;
      color: var(--dim);
      transition: color 0.2s;
    }

    #audio-prompt:hover {
      color: var(--fg);
    }

    #audio-prompt svg {
      display: block;
      width: 26px;
      height: 26px;
    }

    #audio-prompt.playing {
      color: #03ff38;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #sc-player {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Glitch title -->
  <div class="title-wrap">
    <h1 id="glitch-title"></h1>
  </div>

  <!-- Bio + links, bottom-left -->
  <div class="bottom-left">
    <p class="bio">
      Dilan Rey Manahan — <em>Toronto, ON</em>
    </p>
    <div class="section-label">links</div>
    <a class="contact-link" href="https://www.instagram.com/deaddilly" target="_blank" rel="noopener">ig</a>
    <a class="contact-link" href="https://x.com/dilanreymanahan" target="_blank" rel="noopener">x</a>
    <a class="contact-link" href="https://www.instagram.com/deaddilly.archiv/" target="_blank" rel="noopener">hidden</a>
    <a class="contact-link" href="https://www.ggitslab.com" target="_blank" rel="noopener">ggits</a>
    <a class="contact-link" href="mailto:dilan@deaddilly.com">dilan@deaddilly.com</a>
  </div>

  <!-- Hidden SoundCloud player -->
  <iframe id="sc-player"
    src="https://soundcloud.com/deaddilly/etherradiotestmix&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"
    allow="autoplay">
  </iframe>

  <!-- Audio toggle, top-right -->
  <div id="audio-prompt" title="play / pause">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <!-- headband -->
      <path d="M3 14V11a9 9 0 0 1 18 0v3"/>
      <!-- left ear cup -->
      <path d="M3 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3z"/>
      <!-- right ear cup -->
      <path d="M16 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3z"/>
    </svg>
  </div>

  <script>
    // --- AUDIO ---
    const prompt   = document.getElementById('audio-prompt');
    const iframe   = document.getElementById('sc-player');
    let widget     = null;
    let playing    = false;
    let ready      = false;

    const scScript = document.createElement('script');
    scScript.src   = 'https://w.soundcloud.com/player/api.js';
    scScript.onload = () => {
      widget = SC.Widget(iframe);
      widget.bind(SC.Widget.Events.READY, () => {
        ready = true;
        widget.setVolume(80);
      });
      // When track ends, loop it
      widget.bind(SC.Widget.Events.FINISH, () => {
        widget.seekTo(0);
        widget.play();
      });
    };
    document.head.appendChild(scScript);

    prompt.addEventListener('click', () => {
      if (!ready) return;
      if (!playing) {
        widget.play();
        playing = true;
        prompt.classList.add('playing');
      } else {
        widget.pause();
        playing = false;
        prompt.classList.remove('playing');
      }
    });

    // --- GLITCH ---
    const TARGET = 'deaddilly';

    const MOJIBAKE = [
      '死','亡','闇','壊','滅','怨','呪','霊','魂','鬼','無','空','虚','狂','凶',
      'Ж','Ш','Щ','Ф','Ю','Я','Э','Ъ','Ь','Х',
      'ظ','ع','غ','ف','ق','ك','ل','م','ن','ه',
      '∅','∞','∇','∆','⊗','⊘','⊙','†','‡','§','¶',
      '░','▒','▓','█','▄','▀','■','□',
      'ᚱ','ᚢ','ᚦ','ᚨ','ᚷ','ᚹ','ᚺ','ᚾ','ᛁ','ᛃ','ᛇ','ᛈ','ᛉ','ᛊ',
      '☠','☣','⚙','⛧','✝','⌖',
      '𝔄','𝔅','ℭ','𝔇','𝔈','𝔉','𝔊','ℌ','ℑ','𝔍','𝔎','𝔏','𝔐','𝔑',
      '𝔒','𝔓','𝔔','ℜ','𝔖','𝔗','𝔘','𝔙','𝔚','𝔛','𝔜','ℨ',
    ];

    function randMoji() {
      return MOJIBAKE[Math.floor(Math.random() * MOJIBAKE.length)];
    }

    const h1    = document.getElementById('glitch-title');
    const spans = [];

    TARGET.split('').forEach((char) => {
      const span       = document.createElement('span');
      span.className   = 'letter';
      span.textContent = char;
      h1.appendChild(span);
      spans.push(span);
    });

    const states = spans.map(() => ({
      glitchTimer: 0,
      frakTimer:   0,
      offTimer:    0,
    }));

    const TICK = 55;

    function tick() {
      spans.forEach((span, i) => {
        const s = states[i];

        if (s.glitchTimer > 0) s.glitchTimer--;
        if (s.frakTimer   > 0) s.frakTimer--;
        if (s.offTimer    > 0) s.offTimer--;

        const idle = s.glitchTimer === 0 && s.frakTimer === 0 && s.offTimer === 0;

        if (idle) {
          const roll = Math.random();
          if      (roll < 0.04)  s.glitchTimer = 1 + Math.floor(Math.random() * 6);
          else if (roll < 0.06)  s.frakTimer   = 3 + Math.floor(Math.random() * 10);
          else if (roll < 0.075) s.offTimer    = 1 + Math.floor(Math.random() * 3);
        }

        if (s.offTimer > 0) {
          span.style.opacity   = '0';
          span.style.color     = '';
          span.className       = 'letter';
          span.textContent     = TARGET[i];
        } else if (s.glitchTimer > 0) {
          span.style.opacity   = Math.random() > 0.25 ? '1' : '0.05';
          span.style.color     = Math.random() > 0.5  ? '#fff' : '#e8e4dc';
          span.className       = 'letter';
          span.textContent     = randMoji();
        } else if (s.frakTimer > 0) {
          span.style.opacity   = '1';
          span.style.color     = '#e8e4dc';
          span.className       = 'letter frak';
          span.textContent     = TARGET[i];
        } else {
          span.style.color     = Math.random() < 0.007 ? '#fff' : '#e8e4dc';
          span.style.opacity   = '1';
          span.className       = 'letter';
          span.textContent     = TARGET[i];
        }
      });

      // Occasional full cascade
      if (Math.random() < 0.003) {
        spans.forEach((_, i) => {
          setTimeout(() => {
            states[i].glitchTimer = 2 + Math.floor(Math.random() * 5);
          }, i * 25);
        });
      }
    }

    setInterval(tick, TICK);
  </script>

</body>
</html>
